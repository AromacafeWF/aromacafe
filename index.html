<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W&F Aroma Café</title>
<style>
body{font-family:Arial;margin:0;background:#fff8f0}
.wf-tienda{max-width:420px;margin:auto;background:#fff;padding-bottom:40px}
.wf-header{background:#3e2723;color:#fff;text-align:center;padding:25px 15px}
.wf-header img{width:90px;border-radius:50%;border:3px solid #d4a76a}
.wf-header h1{margin:10px 0 5px;font-size:24px}
.wf-header span{color:#d4a76a}
.wf-header p{margin:0;font-size:14px}
.wf-prod{background:#fff;border:2px solid #d4a76a;border-radius:12px;margin:15px;padding:15px;text-align:center}
.wf-prod img{width:100%;border-radius:10px}
.wf-precio{font-size:30px;color:#d4a76a;font-weight:bold;margin:10px 0}
.wf-btn{width:100%;padding:14px;margin:6px 0;border:none;border-radius:10px;font-size:16px;font-weight:bold;color:#fff}
.wf-btn1{background:#d4a76a} 
.wf-btn2{background:#25D366}
</style>
</head>
<body>
<div class="wf-tienda">
  <div class="wf-header">
    <img src="https://i.imgur.com/8QZQZQZ.png">
    <h1>W&F <span>Aroma Café</span></h1>
    <p>Café Premium 100% Peruano - Lonya Grande</p>
  </div>

  <div class="wf-prod">
    <img src="https://i.imgur.com/WWWWWW.png">
    <h3>UNIDAD</h3><p>1 Bolsita 500gr</p>
    <p class="wf-precio">S/ 29.90</p>
    <button class="wf-btn wf-btn1" onclick="window.open('https://wa.me/51939801761?text=Hola%20quiero%201%20UNIDAD%20S/29.90')">Comprar por WhatsApp</button>
  </div>

  <div class="wf-prod">
    <img src="https://i.imgur.com/WWWWWW.png">
    <h3>DÚO AHORRO</h3><p>2 Bolsitas 500gr c/u</p>
    <p class="wf-precio">S/ 59.90</p>
    <button class="wf-btn wf-btn1" onclick="window.open('https://wa.me/51939801761?text=Hola%20quiero%20DUO%20S/59.90')">Comprar por WhatsApp</button>
  </div>

  <div class="wf-prod">
    <img src="https://i.imgur.com/WWWWWW.png">
    <h3>TRÍO FAMILIAR</h3><p>3 Bolsitas 500gr c/u</p>
    <p class="wf-precio">S/ 89.00</p>
    <button class="wf-btn wf-btn1" onclick="window.open('https://wa.me/51939801761?text=Hola%20quiero%20TRIO%20S/89.00')">Comprar por WhatsApp</button>
  </div>
</div>
</body>
</html>
